<!DOCTYPE html>
<html lang="ca">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Conillet amagat: puzle de lògica de conills, lliure, sense anuncis i sense connexió.">
  <meta name="theme-color" content="#2F7A6B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Conillet amagat">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20261025"/>

  <title>Conillet amagat</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: #FBF7F0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }
    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }
    #splash h1 {
      margin: 0;
      color: #2F7A6B;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }
    #splash p { margin: 0; color: #7A6F62; font-size: 0.9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #101413; }
      #splash h1 { color: #CDE3C0; }
      #splash p { color: #A9A094; }
      #splash img { box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <h1>Conillet amagat</h1>
    <p>Carregant el joc…</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
